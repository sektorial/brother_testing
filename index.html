<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Тренажер тестів</title>
  <link rel="stylesheet" href="assets/app.css?v=1.0.4" />
</head>
<body>
  <div id="app">
    <header class="top">
      <button type="button" id="btn-home" class="ghost" hidden>← Меню</button>
      <h1 id="header-title">Тренажер</h1>
      <span id="progress" class="progress" hidden></span>
    </header>

    <main id="screen-home" class="screen">
      <p class="lead">Оберіть пул зі 100 питань (пропорція 20 / 20 / 30 / 30) або відкрийте позначені.</p>
      <section class="block">
        <h2>Пули</h2>
        <div id="pool-grid" class="pool-grid"></div>
      </section>
      <section class="block">
        <h2>Мітки</h2>
        <div id="mark-nav" class="mark-nav"></div>
        <p id="marks-hint" class="muted">Мітки й прогрес відповідей зберігаються лише на цьому пристрої.</p>
        <p id="answers-stats" class="muted"></p>
      </section>
      <section class="block">
        <h2>Скидання</h2>
        <div class="reset-actions">
          <button type="button" id="btn-clear-answers" class="secondary danger-outline">Скинути збережені відповіді</button>
          <button type="button" id="btn-clear-marks" class="secondary danger-outline">Скинути всі мітки</button>
        </div>
      </section>
      <p id="app-version" class="version" aria-label="Версія застосунку"></p>
    </main>

    <div id="confirm-modal" class="confirm-modal" hidden>
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <p id="confirm-title" class="confirm-title">Підтвердження</p>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel" class="secondary">Скасувати</button>
          <button type="button" id="confirm-ok" class="primary danger-fill">Так, скинути</button>
        </div>
      </div>
    </div>

    <main id="screen-quiz" class="screen" hidden>
      <div class="meta-row">
        <span id="q-category" class="pill"></span>
        <div id="mark-bar" class="mark-bar" aria-label="Мітка питання"></div>
      </div>
      <p id="q-text" class="q-text"></p>
      <div id="options" class="options"></div>
      <p id="confidence" class="confidence" hidden></p>
      <div id="pool-live-stats" class="pool-live-stats" hidden></div>
      <button type="button" id="btn-confirm" class="primary" hidden>Підтвердити</button>
      <button type="button" id="btn-next" class="secondary" hidden>Далі</button>
      <details id="pool-reset" class="pool-reset" hidden>
        <summary>Скинути дані цього пулу…</summary>
        <div class="pool-reset-body">
          <button type="button" id="btn-clear-pool-answers" class="link-danger">Скинути відповіді пулу</button>
          <button type="button" id="btn-clear-pool-marks" class="link-danger">Скинути мітки пулу</button>
        </div>
      </details>
    </main>

    <main id="screen-summary" class="screen" hidden>
      <h2>Результат</h2>
      <p id="summary-stats" class="summary-stats"></p>
      <div id="summary-pool-stats" class="pool-live-stats" hidden></div>
      <div class="actions">
        <button type="button" id="btn-mistakes" class="primary" hidden>Пройти роботу над помилками</button>
        <button type="button" id="btn-again" class="secondary">Пройти пул знову</button>
        <button type="button" id="btn-to-home" class="ghost">До меню</button>
      </div>
      <details id="pool-reset-summary" class="pool-reset summary-reset" hidden>
        <summary>Скинути дані цього пулу…</summary>
        <div class="pool-reset-body">
          <button type="button" id="btn-clear-pool-answers-summary" class="link-danger">Скинути відповіді пулу</button>
          <button type="button" id="btn-clear-pool-marks-summary" class="link-danger">Скинути мітки пулу</button>
        </div>
      </details>
    </main>
  </div>
  <script src="assets/version.js?v=1.0.4"></script>
  <script src="assets/quiz-logic.js?v=1.0.4"></script>
  <script src="assets/app.js?v=1.0.4"></script>
</body>
</html>
